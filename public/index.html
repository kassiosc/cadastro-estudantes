<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Estudantes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="cabecalho">
      <h1>Cadastro de Estudantes</h1>
      <p>Gerencie os estudantes cadastrados no sistema.</p>
    </header>

    <section class="painel">
      <h2>Novo estudante</h2>
      <form id="form-aluno">
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="aluno@email.com" required>
        </div>
        <div class="campo">
          <label for="curso">Curso</label>
          <input type="text" id="curso" name="curso" placeholder="Ex.: Desenvolvimento de Sistemas" required>
        </div>
        <button type="submit">Cadastrar estudante</button>
      </form>
      <p id="mensagem" class="mensagem" role="status"></p>
    </section>

    <section class="painel">
      <div class="titulo-tabela">
        <h2>Estudantes cadastrados</h2>
        <span id="total-alunos">0 estudantes</span>
      </div>
      <div class="tabela-responsiva">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Curso</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="lista-alunos">
            <!-- Linhas geradas via JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
